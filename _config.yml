remote_theme: pages-themes/cayman@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-seo-tag
- jekyll-sitemap
title: Camo Tracker
description: Unofficial camo tracker apps for every Call of Duty, from Modern Warfare 4 and Black Ops 7 back to Cold War and Vanguard.
url: https://camotracker.djr.li
lang: en
logo: /icon.jpg
author: Danny Ryman
defaults:
- scope:
    path: ""
  values:
    image: /icon.jpg
# Only the game pages belong in the sitemap; the app data, tools and image
# folders are served for the apps, not for search.
- scope:
    path: "MW4CamoTracker"
  values:
    sitemap: false
- scope:
    path: "BO2CamoTracker"
  values:
    sitemap: false
- scope:
    path: "Data"
  values:
    sitemap: false
- scope:
    path: "Images"
  values:
    sitemap: false
- scope:
    path: "GTAV"
  values:
    sitemap: false
- scope:
    path: "screenshots-pro"
  values:
    sitemap: false
- scope:
    path: "challenges.md"
  values:
    sitemap: false
