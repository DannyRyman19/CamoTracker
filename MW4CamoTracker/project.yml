name: MW4CamoTracker
options:
  bundleIdPrefix: com.DannyRyman
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  MW4CamoTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        type: group
      - path: Resources/weapons.json
        buildPhase: resources
      - path: Resources/multiplayer.json
        buildPhase: resources
      - path: Resources/campaign.json
        buildPhase: resources
      - path: Resources/dmz.json
        buildPhase: resources
      - path: Resources/HitmarkerText-VF.ttf
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MW4 Camo Tracker
        CFBundleDisplayName: MW4 Camo Tracker
        CFBundleIdentifier: com.DannyRyman.MW4CamoTracker
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIAppFonts:
          - HitmarkerText-VF.ttf
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "6.0"
