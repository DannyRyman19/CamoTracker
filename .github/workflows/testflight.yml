name: TestFlight

# Triggers:
#  - push a tag like v1.0.3  -> release build
#  - "Run workflow" button   -> ad-hoc beta, with an optional changelog
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      changelog:
        description: "What testers should know (optional)"
        required: false
        default: ""

# Never let two runs upload the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Only master or a v* tag uploads: "Run workflow" can be pointed at any
    # branch, and side branches have uploaded before.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    # Signing material lives in this environment's secrets, not the repo's, so
    # only runs on an allowed ref can read it. Add a required reviewer to the
    # environment for a manual "ship it" gate.
    environment: testflight
    defaults:
      run:
        working-directory: MW4CamoTracker

    # Third-party and actions/* steps are pinned to a commit SHA (the
    # comment names its release), so a moved tag can't change a run.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # Match the version the project is developed against. If the runner
          # image doesn't carry it yet, pin to the closest it lists at
          # https://github.com/actions/runner-images.
          xcode-version: "26.1"

      - name: Xcode build identity
        id: xcode
        run: |
          # The image can carry a point release (26.1.1) under the 26.1 pin,
          # and a restored module cache built against the previous SDK fails
          # the archive outright ("module.modulemap has been modified since
          # the module file was built"), so the exact build goes in the
          # DerivedData cache key.
          id=$(xcodebuild -version | tr '\n' ' ' | tr -cd '[:alnum:] .' | tr ' ' '-')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Xcode: $id"

      - name: Read marketing version
        id: ver
        run: |
          # The .xcodeproj is committed (no XcodeGen here), so the version
          # comes straight out of the build settings.
          v=$(grep -m1 'MARKETING_VERSION' MW4CamoTracker.xcodeproj/project.pbxproj \
              | sed -E 's/.*= *([0-9.]+);.*/\1/')
          test -n "$v" || { echo "could not read MARKETING_VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true   # bundle install + cache from Gemfile.lock
          working-directory: MW4CamoTracker

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.id }}-${{ hashFiles('MW4CamoTracker/**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.xcode.outputs.id }}-

      # The unit tests gate the upload: a build that fails them never gets
      # as far as the signing secrets or TestFlight. They run unsigned, on
      # the newest iPhone simulator the selected Xcode's SDK can run (the
      # image's device names change too often to hard-code one). The UI
      # tests are left out: they're written for an iPad's grid.
      - name: Pick a simulator
        id: sim
        run: |
          newest_iphone() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          sdk = tuple(int(p) for p in sys.argv[1].split("."))
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit(".iOS-", 1)[1].split("-"))
              if version[:len(sdk)] > sdk:
                  continue
              found += [(version, d["name"], d["udid"]) for d in devices if d["name"].startswith("iPhone")]
          if found:
              version, name, udid = max(found)
              print(udid, name, ".".join(map(str, version)), file=sys.stderr)
              print(udid)
          ' "$(xcrun --sdk iphonesimulator --show-sdk-version)"
          }
          udid=$(newest_iphone)
          if [ -z "$udid" ]; then
            xcrun simctl list runtimes
            xcodebuild -downloadPlatform iOS
            udid=$(newest_iphone)
          fi
          test -n "$udid" || { xcrun simctl list; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test \
            -project MW4CamoTracker.xcodeproj \
            -scheme MW4CamoTracker \
            -destination "id=$SIM_UDID" \
            -only-testing:MW4CamoTrackerTests \
            -resultBundlePath "$RUNNER_TEMP/unit-tests.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # The lane reads the App Store Connect key from ASC_KEY_P8 itself, so
      # only the certificate is written to disk.
      - name: Decode signing secrets
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
        run: |
          echo "$DIST_CERT_P12" | base64 --decode > fastlane/dist_cert.p12
          test -s fastlane/dist_cert.p12 || { echo "DIST_CERT_P12 secret is empty"; exit 1; }

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane beta

      - name: Clean up signing material
        if: always()
        run: rm -f fastlane/dist_cert.p12 fastlane/AuthKey.p8

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            MW4CamoTracker/fastlane/report.xml
            ${{ runner.temp }}/unit-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
