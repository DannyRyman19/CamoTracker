name = "camotracker-appstore-notifications"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Identifies which Cloudflare account to deploy to — not a credential on its own (that's the API
# token / login), so it's fine to commit even though this repo is public.
account_id = "20fce1fae0c7fbe6cdc2eeb0d51515c6"

[vars]
# This repo is public, so only genuinely non-sensitive values belong here — both of these are
# already publicly visible via the App Store listing / the committed Xcode project.

# The app's bundle identifier, e.g. from Xcode's PRODUCT_BUNDLE_IDENTIFIER.
APP_BUNDLE_ID = "com.DannyRyman.MW4CamoTracker"

# The app's numeric Apple ID (App Store Connect > App Information > Apple ID / "General Information").
# Only required to verify PRODUCTION notifications; sandbox testing works without it.
APP_APPLE_ID = ""

# Everything else — where emails get sent, the "from" address, and the Resend API key — is a
# secret set with `wrangler secret put <NAME>`, never written here, so it never lands in git
# history on this public repo:
#   RESEND_API_KEY
#   NOTIFY_EMAIL
#   NOTIFY_FROM_EMAIL
